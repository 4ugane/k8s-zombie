name: "k8s-zombie scan"
description: "Scan a Kubernetes cluster for orphaned resources and report AWS cost estimates"
author: "4ugane"
branding:
  icon: "search"
  color: "purple"

inputs:
  version:
    description: "k8s-zombie release to install (e.g. v0.1.5). Defaults to the latest release."
    required: false
    default: "latest"
  context:
    description: "kubeconfig context to scan (default: current context)"
    required: false
    default: ""
  namespace:
    description: "Only report findings in this namespace"
    required: false
    default: ""
  exclude-namespace:
    description: "Comma-separated namespaces to exclude, e.g. kube-system,cert-manager"
    required: false
    default: ""
  output:
    description: "Report format written to report-path: table, json, markdown, or html"
    required: false
    default: "table"
  pricing-file:
    description: "Path to a custom pricing YAML file"
    required: false
    default: ""
  min-age:
    description: "Ignore resources created more recently than this (e.g. 1h, 30m)"
    required: false
    default: ""
  fail-on-findings:
    description: "Fail this step if any orphaned resource is found — set true to gate a PR"
    required: false
    default: "false"

outputs:
  report-path:
    description: "Path to the generated report, in the requested output format"
    value: ${{ steps.scan.outputs.report-path }}
  findings-count:
    description: "Number of orphaned findings (Status: Orphaned) from the scan"
    value: ${{ steps.scan.outputs.findings-count }}

runs:
  using: "composite"
  steps:
    # Every input below is passed via `env:`, never spliced as `${{ }}` into the
    # script body — a workflow could feed this action an input derived from
    # untrusted content (e.g. a PR title), and interpolating that directly into
    # a run: block is a script-injection risk, not just a style preference.
    - name: Install k8s-zombie
      shell: bash
      env:
        ZOMBIE_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail

        case "$RUNNER_OS" in
          Linux) os="linux" ;;
          macOS) os="darwin" ;;
          Windows) os="windows" ;;
          *) echo "::error::unsupported RUNNER_OS: $RUNNER_OS"; exit 1 ;;
        esac
        case "$RUNNER_ARCH" in
          X64) arch="amd64" ;;
          ARM64) arch="arm64" ;;
          *) echo "::error::unsupported RUNNER_ARCH: $RUNNER_ARCH"; exit 1 ;;
        esac
        ext="tar.gz"
        [ "$os" = "windows" ] && ext="zip"

        if [ "$ZOMBIE_VERSION" = "latest" ]; then
          tag="$(curl -sf https://api.github.com/repos/4ugane/k8s-zombie/releases/latest | grep -o '"tag_name": *"[^"]*"' | cut -d'"' -f4)"
        else
          tag="$ZOMBIE_VERSION"
        fi

        # tag ends up as both a URL path segment and (via $asset below) a local
        # file path component — validate it BEFORE either use. Without this, a
        # version input containing e.g. "../" could write the downloaded
        # archive outside $workdir (path traversal), independent of whatever
        # the shell-injection hardening above already covers.
        if ! [[ "$tag" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+([A-Za-z0-9.-]*)?$ ]]; then
          echo "::error::invalid version: '$ZOMBIE_VERSION' (resolved tag: '$tag') — expected a semver-style tag like v0.1.5"
          exit 1
        fi
        version_no_v="${tag#v}"

        asset="k8s-zombie_${version_no_v}_${os}_${arch}.${ext}"
        base_url="https://github.com/4ugane/k8s-zombie/releases/download/${tag}"

        workdir="$(mktemp -d)"
        curl -sfL "${base_url}/checksums.txt" -o "$workdir/checksums.txt"
        curl -sfL "${base_url}/${asset}" -o "$workdir/${asset}"

        (cd "$workdir" && grep -F -- " ${asset}" checksums.txt | sha256sum -c -)

        if [ "$ext" = "zip" ]; then
          unzip -q "$workdir/${asset}" -d "$workdir/bin"
        else
          mkdir -p "$workdir/bin"
          tar xzf "$workdir/${asset}" -C "$workdir/bin"
        fi
        chmod +x "$workdir/bin/k8s-zombie"* 2>/dev/null || true
        echo "$workdir/bin" >> "$GITHUB_PATH"

    - name: Run scan
      id: scan
      shell: bash
      env:
        ZOMBIE_CONTEXT: ${{ inputs.context }}
        ZOMBIE_NAMESPACE: ${{ inputs.namespace }}
        ZOMBIE_EXCLUDE_NAMESPACE: ${{ inputs.exclude-namespace }}
        ZOMBIE_OUTPUT: ${{ inputs.output }}
        ZOMBIE_PRICING_FILE: ${{ inputs.pricing-file }}
        ZOMBIE_MIN_AGE: ${{ inputs.min-age }}
        ZOMBIE_FAIL_ON_FINDINGS: ${{ inputs.fail-on-findings }}
      run: |
        set -euo pipefail

        base_args=()
        [ -n "$ZOMBIE_CONTEXT" ] && base_args+=(--context "$ZOMBIE_CONTEXT")
        [ -n "$ZOMBIE_NAMESPACE" ] && base_args+=(--namespace "$ZOMBIE_NAMESPACE")
        [ -n "$ZOMBIE_PRICING_FILE" ] && base_args+=(--pricing-file "$ZOMBIE_PRICING_FILE")
        [ -n "$ZOMBIE_MIN_AGE" ] && base_args+=(--min-age "$ZOMBIE_MIN_AGE")
        if [ -n "$ZOMBIE_EXCLUDE_NAMESPACE" ]; then
          IFS=',' read -ra ns <<< "$ZOMBIE_EXCLUDE_NAMESPACE"
          for n in "${ns[@]}"; do base_args+=(--exclude-namespace "$n"); done
        fi

        workdir="$(mktemp -d)"
        k8s-zombie scan "${base_args[@]}" --output json > "$workdir/report.json"

        count="$(jq '[.[] | select(.status == "Orphaned")] | length' "$workdir/report.json")"
        echo "findings-count=$count" >> "$GITHUB_OUTPUT"

        # A second live scan for the requested format, when it isn't json — the
        # CLI has no "re-render this JSON in another format" mode. This means
        # findings-count and report-path reflect two separate snapshots of a
        # live cluster; on rare timing (a Pod finishing, a PVC being deleted
        # between the two calls) they can disagree in count. Documented
        # limitation, not a bug: there's no cluster-side lock to scan against.
        report_path="$workdir/report.json"
        if [ -n "$ZOMBIE_OUTPUT" ] && [ "$ZOMBIE_OUTPUT" != "json" ]; then
          ext="txt"
          case "$ZOMBIE_OUTPUT" in
            markdown) ext="md" ;;
            html) ext="html" ;;
          esac
          report_path="$workdir/report.$ext"
          k8s-zombie scan "${base_args[@]}" --output "$ZOMBIE_OUTPUT" > "$report_path"
        fi
        echo "report-path=$report_path" >> "$GITHUB_OUTPUT"

        echo "k8s-zombie found $count orphaned resource(s) — full report: $report_path"

        if [ "$ZOMBIE_FAIL_ON_FINDINGS" = "true" ] && [ "$count" -gt 0 ]; then
          echo "::error::k8s-zombie found $count orphaned resource(s)"
          exit 1
        fi
