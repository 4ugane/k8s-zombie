apiVersion: v1
kind: Namespace
metadata:
  name: k8s-zombie-test
---
apiVersion: v1
kind: Namespace
metadata:
  name: k8s-zombie-test-empty
---
# unattached-pvc: never mounted by any pod
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: orphan-pvc
  namespace: k8s-zombie-test
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
# orphaned-pv: Retain-policy StorageClass, provisioned+bound by a throwaway pod
# below, then the pod/PVC get deleted by the CI workflow, leaving the PV
# "Released" — a real controller-driven lifecycle, not a faked status field.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: retain-test
provisioner: rancher.io/local-path
reclaimPolicy: Retain
volumeBindingMode: WaitForFirstConsumer
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: retain-pvc
  namespace: k8s-zombie-test
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: retain-test
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: retain-consumer
  namespace: k8s-zombie-test
spec:
  restartPolicy: Never
  containers:
    - name: busybox
      image: busybox:1.36
      command: ["sh", "-c", "echo hi && sleep 3600"]
      volumeMounts:
        - name: data
          mountPath: /data
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: retain-pvc
---
# zero-endpoint-service: selector matches no pods, so the real EndpointSlice
# controller creates a slice (or none) with 0 ready addresses.
apiVersion: v1
kind: Service
metadata:
  name: dead-svc
  namespace: k8s-zombie-test
spec:
  selector:
    app: nothing-matches-this
  ports:
    - port: 80
---
# unused-configmap-secret: never referenced by any pod
apiVersion: v1
kind: ConfigMap
metadata:
  name: orphan-cm
  namespace: k8s-zombie-test
data:
  key: value
---
apiVersion: v1
kind: Secret
metadata:
  name: orphan-secret
  namespace: k8s-zombie-test
type: Opaque
stringData:
  key: value
---
# orphaned-ingress: backend Service doesn't exist
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dead-ingress
  namespace: k8s-zombie-test
spec:
  rules:
    - host: dead.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nonexistent-svc
                port:
                  number: 80
---
# idle-deployment: bogus image, never becomes ready — the real Deployment
# controller keeps Status.ReadyReplicas at 0, no faked status needed.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: idle-worker
  namespace: k8s-zombie-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: idle-worker
  template:
    metadata:
      labels:
        app: idle-worker
    spec:
      containers:
        - name: idle-worker
          image: this-image-does-not-exist-anywhere:v1
---
# stale-hpa: targets a Deployment that doesn't exist
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: stale-hpa
  namespace: k8s-zombie-test
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: does-not-exist
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 80
---
# completed-jobs-and-pods: exits immediately, leaves a Succeeded pod — the
# real Job controller sets Status.CompletionTime, no faked status needed.
apiVersion: batch/v1
kind: Job
metadata:
  name: quick-job
  namespace: k8s-zombie-test
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: quick-job
          image: busybox:1.36
          command: ["sh", "-c", "exit 0"]
