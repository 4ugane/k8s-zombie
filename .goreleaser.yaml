version: 2

project_name: k8s-zombie

before:
  hooks:
    - go mod tidy

builds:
  - id: k8s-zombie
    main: ./cmd/k8s-zombie
    binary: k8s-zombie
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{ .Version }}
  # Identical binary, built again under the kubectl-<plugin> naming convention
  # krew requires — kubectl's plugin mechanism looks for a "kubectl-zombie"
  # executable on PATH, so this build exists purely for that packaging need.
  - id: kubectl-zombie
    main: ./cmd/k8s-zombie
    binary: kubectl-zombie
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - id: default
    ids: [k8s-zombie]
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
  - id: krew
    ids: [kubectl-zombie]
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    # .Tag (not .Version) — krew-release-bot's .krew.yaml template only exposes
    # .TagName (the full tag, "v0.1.5"), with no string-trim function to derive
    # a "0.1.5"-style version from it. Matching the archive name to .TagName
    # directly avoids needing one.
    name_template: >-
      kubectl-zombie_{{ .Tag }}_{{ .Os }}_{{ .Arch }}

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  github:
    owner: 4ugane
    name: k8s-zombie

# Requires a HOMEBREW_TAP_GITHUB_TOKEN secret in this repo's Actions settings
# (a PAT for the 4ugane account with write access to the tap repo below) and
# for github.com/4ugane/homebrew-tap to exist first — goreleaser pushes the
# generated cask there, it doesn't create the repo itself. Casks (not the
# older Formula format) are goreleaser's current supported path even for a
# plain CLI binary like this one — see https://goreleaser.com/deprecations/#brews.
homebrew_casks:
  - name: k8s-zombie
    ids: [default]
    repository:
      owner: 4ugane
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Casks
    homepage: "https://github.com/4ugane/k8s-zombie"
    description: "Scan Kubernetes clusters for orphaned resources burning budget, with AWS cost estimates"
    binaries:
      - k8s-zombie
    # The binary isn't code-signed/notarized (no Apple Developer account),
    # so macOS Gatekeeper quarantines it on download and SIGKILLs it on first
    # run. Strip the quarantine attribute post-install — standard practice
    # for unsigned CLI casks.
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/k8s-zombie"]
          end

# krew manifest updates are handled by krew-release-bot (a separate step in
# .github/workflows/release.yml, after this goreleaser run), which reads
# .krew.yaml at the repo root and opens the PR to kubernetes-sigs/krew-index
# directly — no token from us, no intermediate fork/manual-PR step. See
# https://krew.sigs.k8s.io/docs/developer-guide/release/automating-updates/
