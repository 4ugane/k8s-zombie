name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - name: build
        run: go build ./...
      - name: vet
        run: go vet ./...
      - name: gofmt
        run: |
          fmt_out="$(gofmt -l .)"
          if [ -n "$fmt_out" ]; then
            echo "gofmt would reformat:"
            echo "$fmt_out"
            exit 1
          fi
      - name: test
        run: go test ./... -race -cover

  integration-test:
    name: Integration Test (kind)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - uses: helm/kind-action@v1
        with:
          cluster_name: k8s-zombie
      - name: integration test
        env:
          INTEGRATION_KUBE_CONTEXT: kind-k8s-zombie
        run: go test -tags=integration -v -timeout=5m ./test/integration/...
