name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - name: build
        run: go build ./...
      - name: vet
        run: go vet ./...
      - name: gofmt
        run: |
          fmt_out="$(gofmt -l .)"
          if [ -n "$fmt_out" ]; then
            echo "gofmt would reformat:"
            echo "$fmt_out"
            exit 1
          fi
      - name: test
        run: go test ./... -race -cover

  integration-test:
    name: Integration Test (kind)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - uses: helm/kind-action@v1
        with:
          cluster_name: k8s-zombie
      - name: integration test
        env:
          INTEGRATION_KUBE_CONTEXT: kind-k8s-zombie
        run: go test -tags=integration -v -timeout=5m ./test/integration/...

  test-action:
    name: Test composite action (kind)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: helm/kind-action@v1
        with:
          cluster_name: k8s-zombie-action-test
      - name: apply fixtures
        run: kubectl apply -f test/integration/testdata/fixtures.yaml
      - name: run the action (default settings)
        id: zombie
        uses: ./
        with:
          output: json
      - name: verify outputs
        run: |
          set -euo pipefail
          echo "findings-count=${{ steps.zombie.outputs.findings-count }}"
          if [ "${{ steps.zombie.outputs.findings-count }}" -lt 1 ]; then
            echo "::error::expected at least 1 finding from the fixtures, got 0"
            exit 1
          fi
          cat "${{ steps.zombie.outputs.report-path }}"
      - name: run the action (fail-on-findings)
        id: zombie-gate
        uses: ./
        continue-on-error: true
        with:
          fail-on-findings: "true"
      - name: verify fail-on-findings actually failed the step
        run: |
          if [ "${{ steps.zombie-gate.outcome }}" != "failure" ]; then
            echo "::error::expected fail-on-findings=true to fail the step, outcome was ${{ steps.zombie-gate.outcome }}"
            exit 1
          fi
