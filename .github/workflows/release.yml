name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
      # Reads .krew.yaml and opens the PR to kubernetes-sigs/krew-index
      # directly — needs no token/secret from this repo at all; see
      # https://krew.sigs.k8s.io/docs/developer-guide/release/automating-updates/
      - name: Update new version in krew-index
        uses: rajatjindal/krew-release-bot@v0.0.50
